# Publishes the Docker images to GitHub Container Registry and deploys the
# marketing site to Cloudflare Workers.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes 1.2.3, 1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Images, named <product>-<edition> like portainer/portainer-ce:
#   ghcr.io/<owner>/montara-pass-ee    the Go API serving the web app (apps/server + apps/app), Enterprise Edition
#   ghcr.io/<owner>/montara-pass-ce    the same, Community Edition: no sign-up, no sharing
#   ghcr.io/<owner>/montara-pass-docs  apps/docs (this documentation site)

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64

jobs:
  release-images:
    name: Release ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both install from the workspace lockfile, so they build from the root.
          - image: montara-pass-ee
            file: apps/server/Dockerfile
            edition: ee
          - image: montara-pass-ce
            file: apps/server/Dockerfile
            edition: ce
          - image: montara-pass-docs
            file: apps/docs/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes the VITE_* values into the web app inside the server
          # image, APP_VERSION goes into the Go binary and EDITION into both;
          # the docs image ignores them. VITE_API_URL stays empty for the usual setup, where
          # the server serves the app itself: set the repo Variable only when
          # the API lives on another origin than the UI.
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Montara Pass' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            APP_VERSION=${{ github.ref_name }}
            EDITION=${{ matrix.edition || 'ee' }}
          push: true
          # One cache scope per image, or the builds evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Deploys the marketing site on every release run (tag push or manual
  # dispatch); the workflow itself never triggers on branch pushes.
  release-web:
    name: Deploy web to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @montara-pass/web...

      # vinext-cloudflare builds, then deploys the Worker described in
      # apps/web/cloudflare.config.ts with the cf CLI.
      - name: Build & Deploy
        run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
