packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - cf@1.0.0-beta.14

overrides:
  # GHSA-px8p-9vwx-vf98: satori (via vinext's @vercel/og) asks for 0.7.3.
  'fflate@<0.7.5': 0.7.5
  # GHSA-238p-pmpm-9mq7: micromark-extension-math (via @milkdown/crepe) asks
  # for 0.16; crepe itself already runs on 0.18.
  'katex@<0.18.2': 0.18.10
  # Next.js RCE/DoS advisories (fixed in 16.4.1); vinext pulls next for app/web.
  'next@>=16.0.0 <16.4.1': 16.4.3
  # DOMPurify SAFE_FOR_TEMPLATES / IN_PLACE bypasses, via @milkdown.
  'dompurify@<3.4.17': 3.4.17
  # Zod oversized-collection DoS (GHSA-mrhx-c7xc-m3w5), fixed only in v4.6.6:
  # @cloudflare/config (via apps/web's vite plugin) pins 4.6.5.
  'zod@<4.6.6': 4.6.7
  # undici DoS / SRI bypass, via vinext.
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # GHSA-9wx9-5pv9-3349, GHSA-f86p-h4j2-7qgj: seroval script injection, via
  # TanStack Router's router-core (app and docs).
  'seroval@>=1.5.5 <1.6.11': 1.6.12
  # GHSA-86w9-cpqp-85rv: node-forge RSA signature check, via web-ext.
  'node-forge@<1.4.1': 1.4.2
  # minimatch globparts DoS (fixed in 11.0.1), via eslint 10's config-array,
  # which asks for ^10.2.4 and runs on 11 unchanged.
  'minimatch@>=10.0.0 <11.0.1': 11.0.4

# GHSA-gcqx-w48m-w2h4: deepmerge (via web-ext's addons-linter) lets an own __proto__ key
# from the target set the merged object's prototype. The advisory's fix,
# 4.3.2, was never published (latest is 4.3.1), so 4.3.1 is patched to skip
# that key instead.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch

# pnpm audit reads versions, not patches: deepmerge 4.3.1 is patched above.
# Drop this once a fixed deepmerge is published and the override replaces it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
