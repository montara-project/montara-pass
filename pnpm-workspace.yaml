packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - cf@1.0.0-beta.14
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - '@expo/ui@58.0.23'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-glass-effect@58.0.5
  - expo-image@58.0.17
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-router@58.0.26
  - expo-server@58.0.6
  - expo@58.0.19

overrides:
  # GHSA-px8p-9vwx-vf98: satori (via vinext's @vercel/og) asks for 0.7.3.
  'fflate@<0.7.5': 0.7.5
  # GHSA-238p-pmpm-9mq7: micromark-extension-math (via @milkdown/crepe) asks
  # for 0.16; crepe itself already runs on 0.18.
  'katex@<0.18.2': 0.18.10
  # Next.js RCE/DoS advisories (fixed in 16.4.1); vinext pulls next for app/web.
  'next@>=16.0.0 <16.4.1': 16.4.3
  # DOMPurify SAFE_FOR_TEMPLATES / IN_PLACE bypasses, via @milkdown.
  'dompurify@<3.4.17': 3.4.17
  # Zod oversized-collection DoS (GHSA-mrhx-c7xc-m3w5), fixed only in v4.
  # @expo/cli asks for v3 but only uses v4-compatible schema APIs.
  'zod@<4.6.6': 4.6.7
  # undici DoS / SRI bypass, via vinext.
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # fast-uri scheme/host confusion, via Expo's webpack toolchain.
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
